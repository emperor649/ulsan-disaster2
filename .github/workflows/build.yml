name: APK 빌드

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Gradle Wrapper 생성
        run: gradle wrapper --gradle-version 8.5

      - name: local.properties 생성
        run: |
          cat > local.properties << 'PROPS'
          KMA_SERVICE_KEY=${{ secrets.KMA_SERVICE_KEY }}
          TIDE_SERVICE_KEY=${{ secrets.TIDE_SERVICE_KEY }}
          KMA_APIHUB_KEY=${{ secrets.KMA_APIHUB_KEY }}
          DISASTER_SERVICE_KEY=${{ secrets.DISASTER_SERVICE_KEY }}
          FLOOD_SERVICE_KEY=${{ secrets.FLOOD_SERVICE_KEY }}
          PROPS

      - name: 빌드
        run: ./gradlew assembleDebug --stacktrace

      - name: APK 업로드
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 기상재난알림-apk
          path: app/build/outputs/apk/debug/*.apk
