plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Firebase를 쓰려면 아래 주석을 해제하고 app/google-services.json을 배치하세요.
    // (없으면 빌드 실패합니다)
    // id 'com.google.gms.google-services'
}

android {
    namespace 'com.ulsan.disasteralert'
    compileSdk 34

    defaultConfig {
        applicationId "com.ulsan.disasteralert"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // 공공데이터포털에서 발급받은 서비스키를 local.properties에 두고 주입하는 방식 권장
        buildConfigField "String", "KMA_SERVICE_KEY", "\"${project.findProperty('KMA_SERVICE_KEY') ?: ''}\""
        buildConfigField "String", "DISASTER_SERVICE_KEY", "\"${project.findProperty('DISASTER_SERVICE_KEY') ?: ''}\""
        buildConfigField "String", "FLOOD_SERVICE_KEY", "\"${project.findProperty('FLOOD_SERVICE_KEY') ?: ''}\""
        buildConfigField "String", "TIDE_SERVICE_KEY", "\"${project.findProperty('TIDE_SERVICE_KEY') ?: ''}\""
        buildConfigField "String", "KMA_APIHUB_KEY", "\"${project.findProperty('KMA_APIHUB_KEY') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'

    // 네트워킹
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // 백그라운드 주기적 polling (기상/재난 데이터 수집)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // 위치 기반 지역 매핑
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // 실시간 푸시 알림 (긴급 경보는 서버 push로 즉시 전달)
    // Firebase 사용 시 아래 두 줄 주석 해제
    // implementation platform('com.google.firebase:firebase-bom:33.1.0')
    // implementation 'com.google.firebase:firebase-messaging-ktx'

    // 코루틴
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
